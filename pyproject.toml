[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bz-studio"
version = "2.1.1"
description = "Wide-area microscopy mosaic, plate-image, and KTF desktop studio"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — All Rights Reserved" }
authors = [{ name = "Yoshi Kobayashi" }]
keywords = ["bz-x", "ktf", "microscopy", "image-viewer", "stitching", "bioimaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "PySide6-Essentials==6.10.3",
    "numpy>=1.24",
    "Pillow>=10.0",
    "tifffile>=2023.7",
    "imagecodecs>=2024.1",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/yoshi-koba-lab/bz-studio"
Issues = "https://github.com/yoshi-koba-lab/bz-studio/issues"

[project.gui-scripts]
bz-studio = "main:main"
bz-plate-studio = "main:main"

[tool.setuptools]
py-modules = ["main", "ktf_reader", "render", "stitcher", "mosaic", "mosaic_engine", "mosaic_ui", "version"]
