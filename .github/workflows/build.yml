name: Build standalone apps

# Build macOS (.app) and Windows (folder) bundles.
# - On a version tag (v1.0.0, ...) the zips are attached to a GitHub Release.
# - Manual runs (workflow_dispatch) upload them as workflow artifacts you can download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/attach releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Apple Silicon build to macOS 15 instead of macos-latest.
          # Freezing on the oldest supported OS gives the PyInstaller bundle a
          # predictable deployment target; macos-latest can move to a newer OS.
          - os: macos-15
            artifact: BZ-Studio-macOS-appleSilicon
            bundle: "dist/BZ Studio.app"
          - os: macos-15-intel
            artifact: BZ-Studio-macOS-intel
            bundle: "dist/BZ Studio.app"
          - os: windows-latest
            artifact: BZ-Studio-Windows
            bundle: "dist/BZ Studio"
    runs-on: ${{ matrix.os }}
    # A retired runner label queues forever instead of failing; cap it so a bad
    # label is visible in minutes rather than blocking the release.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify public repository boundary
        run: python tools/check_share_boundary.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify minimal Qt runtime
        shell: bash
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('PySide6.QtPdf') is None"
          python -c "import importlib.metadata as m; assert m.version('PySide6_Essentials') == '6.10.3'"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          BZPS_TEST: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm ktf_viewer.spec

      - name: Verify frozen Qt module allowlist
        run: python tools/verify_frozen_bundle.py "${{ matrix.bundle }}"

      - name: Smoke-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          smoke_dir="$RUNNER_TEMP/bz-studio-smoke"
          BZ_STUDIO_PACKAGE_SMOKE="$smoke_dir" QT_QPA_PLATFORM=offscreen \
            "dist/BZ Studio.app/Contents/MacOS/BZ Studio"
          python -c "import json,sys; assert json.load(open(sys.argv[1], encoding='utf-8'))['ok']" \
            "$smoke_dir/package-smoke.json"

      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "bz-studio-smoke"
          $env:BZ_STUDIO_PACKAGE_SMOKE = $smokeDir
          & "dist/BZ Studio/BZ Studio.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged codec smoke test failed" }
          python -c "import json,sys; assert json.load(open(sys.argv[1], encoding='utf-8'))['ok']" (Join-Path $smokeDir "package-smoke.json")

      - name: Zip bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md qt-source-assets.sha256 dist/
          cp -R licenses dist/licenses
          cd dist
          zip -ry "../${{ matrix.artifact }}.zip" \
            "BZ Studio.app" LICENSE THIRD_PARTY_NOTICES.md qt-source-assets.sha256 licenses

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,qt-source-assets.sha256 -Destination "dist/BZ Studio"
          Copy-Item licenses -Destination "dist/BZ Studio/licenses" -Recurse
          Compress-Archive -Path "dist/BZ Studio/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only after every platform has built and tested successfully, so
      # a failed matrix leg can never create a partial public release.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Download exact LGPL corresponding source
        run: |
          curl --fail --location --retry 3 --output release-assets/pyside-setup-everywhere-src-6.10.3.tar.xz \
            https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.10.3-src/pyside-setup-everywhere-src-6.10.3.tar.xz
          curl --fail --location --retry 3 --output release-assets/qtbase-everywhere-src-6.10.3.tar.xz \
            https://download.qt.io/official_releases/qt/6.10/6.10.3/submodules/qtbase-everywhere-src-6.10.3.tar.xz
          curl --fail --location --retry 3 --output release-assets/qtsvg-everywhere-src-6.10.3.tar.xz \
            https://download.qt.io/official_releases/qt/6.10/6.10.3/submodules/qtsvg-everywhere-src-6.10.3.tar.xz
          curl --fail --location --retry 3 --output release-assets/qtimageformats-everywhere-src-6.10.3.tar.xz \
            https://download.qt.io/official_releases/qt/6.10/6.10.3/submodules/qtimageformats-everywhere-src-6.10.3.tar.xz
          curl --fail --location --retry 3 --output release-assets/qttranslations-everywhere-src-6.10.3.tar.xz \
            https://download.qt.io/official_releases/qt/6.10/6.10.3/submodules/qttranslations-everywhere-src-6.10.3.tar.xz
          cd release-assets
          sha256sum --check ../qt-source-assets.sha256

      - name: Attach all bundles to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
